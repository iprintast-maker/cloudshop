name: Iprint Desktop Windows build
on:
  push:
    paths: ['windows-pos/**', '.github/workflows/desktop-pos-build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build self-contained Windows application
        shell: pwsh
        run: dotnet publish windows-pos/IprintDesk.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/app
      - name: Verify Windows executable and installer syntax
        shell: pwsh
        run: |
          $errors=$null; $tokens=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path windows-pos/Install.ps1),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){throw ($errors | Out-String)}
          $p=Start-Process (Resolve-Path dist/app/IprintDesk.exe) -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Application smoke test failed: $($p.ExitCode)"}
          Get-Content "$env:TEMP/iprint-desk-self-test.txt"
      - name: Package application
        shell: pwsh
        run: |
          Copy-Item windows-pos/INSTALL.cmd,windows-pos/START.cmd,windows-pos/UNINSTALL.cmd,windows-pos/Install.ps1,windows-pos/README.txt dist/app/
          Compress-Archive -Path dist/app/* -DestinationPath dist/Iprint-Desk-Windows-x64.zip
          (Get-FileHash dist/Iprint-Desk-Windows-x64.zip -Algorithm SHA256).Hash | Set-Content dist/Iprint-Desk-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Iprint-Desk-Windows-x64
          path: |
            dist/Iprint-Desk-Windows-x64.zip
            dist/Iprint-Desk-Windows-x64.zip.sha256
      - name: Publish downloadable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='desktop-pos-v0.1.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Айпринт · касса для Windows 0.1.0' --notes-file windows-pos/README.txt}
          gh release upload $tag dist/Iprint-Desk-Windows-x64.zip dist/Iprint-Desk-Windows-x64.zip.sha256 --clobber --repo $env:GITHUB_REPOSITORY
